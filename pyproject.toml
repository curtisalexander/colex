[project]
name = "colex"
version = "0.1.0"
description = "Personal CoCo tools: native commands and PowerShell over MCP."
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "anyio>=4,<5", "psutil>=7.0,<8"]

[project.scripts]
colex = "colex.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
